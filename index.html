<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f7fb">
  <meta name="description" content="Make a countdown for the moments that matter and share it with your friends.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Downcount">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">

  <title>Downcount — make every moment count</title>

</head>
<body>

    <a class="brand" href="#/" aria-label="Downcount home"><span class="brand-mark">↘</span> downcount</a>

      <a class="nav-link" href="#/create">Create a countdown <span aria-hidden="true">↗</span></a>
