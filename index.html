<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Downcount</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- App Main Layout -->
  <div class="app-container">
    <h1>Downcount</h1>
    <button id="open-settings-btn" class="btn">Settings ⚙️</button>
  </div>

  <!-- Settings Modal / Menu -->
  <div id="settings-modal" class="modal" style="display: none;">
    <div class="modal-content">
      <span id="close-settings-btn" class="close">&times;</span>
      <h2>Settings</h2>
      
      <!-- Existing settings elements go here -->

      <!-- NEW: Share Data Section added to Settings Menu -->
      <div class="settings-section" style="margin-top: 20px; border-top: 1px solid #ccc; padding-top: 15px;">
        <h3>Share Data</h3>
        <p style="font-size: 0.9em; color: #666;">Create a link containing all your current settings and data to use on another device.</p>
        
        <button id="share-data-btn" class="settings-action-btn" style="padding: 8px 16px; cursor: pointer;">Share My Data</button>
        
        <div id="share-link-box" style="display: none; margin-top: 10px;">
          <input type="text" id="share-link-input" readonly style="width: 100%; padding: 6px; box-sizing: border-box;" />
          <button id="copy-link-btn" style="margin-top: 5px; padding: 6px 12px; cursor: pointer;">Copy Link</button>
        </div>
      </div>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
